        /* LINE Brand Colors */
        .text-line { color: #06C755; }

        /* Checkerboard pattern */
        .grid-bg { 
            background-image: linear-gradient(45deg, #334155 25%, transparent 25%),

        const IconCrop = (props) => <Icon {...props}><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></Icon>;

        // --- Worker Script ---
        const workerScript = `
        self.onmessage = function(e) {
            const { imageBitmap, id, targetColor, tolerance, smoothness, despill } = e.data;
            const w = imageBitmap.width;
            const h = imageBitmap.height;
            const canvas = new OffscreenCanvas(w, h);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imageBitmap, 0, 0);
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const tr = parseInt(targetColor.slice(1, 3), 16);
            const tg = parseInt(targetColor.slice(3, 5), 16);
            const tb = parseInt(targetColor.slice(5, 7), 16);
            const distThreshold = tolerance * 4.42; 
            const ramp = Math.max(1, smoothness * 5); 

            // 第一階段：基礎去背
            const alphas = new Uint8Array(w * h);
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const dist = Math.sqrt((r - tr) * (r - tr) + (g - tg) * (g - tg) + (b - tb) * (b - tb));
                let alpha = 255;
                if (dist < distThreshold) alpha = 0; 
                else if (dist < distThreshold + ramp) alpha = ((dist - distThreshold) / ramp) * 255;
                
                if (despill && alpha > 0) {
                    if (targetColor.toLowerCase() === '#00ff00') {
                        if (g > r && g > b) data[i+1] = (r + b) / 2; 
                    }
                }
                alphas[i/4] = alpha;
            }

            // 第二階段：優化 3px 深度移除殘留黑邊
            const trim = 3; 
            const finalAlphas = new Uint8Array(alphas);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = y * w + x;
                    if (alphas[idx] > 0) {
                        let shouldClear = false;
                        for (let dy = -trim; dy <= trim; dy++) {
                            for (let dx = -trim; dx <= trim; dx++) {
                                const nx = x + dx; const ny = y + dy;
                                if (nx < 0 || nx >= w || ny < 0 || ny >= h || alphas[ny * w + nx] === 0) {
                                    shouldClear = true; break;
                                }
                            }
                            if (shouldClear) break;
                        }
                        if (shouldClear) finalAlphas[idx] = 0;
                    }
                }
            }

            for (let i = 0; i < data.length; i += 4) {
                data[i + 3] = finalAlphas[i / 4];
            }

            ctx.putImageData(imgData, 0, 0);
            canvas.convertToBlob({ type: 'image/png' }).then(blob => {
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => self.postMessage({ id, dataUrl: reader.result });
            });
        };
        `;

        const App = () => {
            const [originalSheet, setOriginalSheet] = useState(null);
            const [slicedPieces, setSlicedPieces] = useState([]); 
            const [finalImages, setFinalImages] = useState([]); 
            const [mainId, setMainId] = useState(null);
            const [tabId, setTabId] = useState(null);
            const [startNumber, setStartNumber] = useState(1); 
            const [step, setStep] = useState(1); 
            const [isProcessing, setIsProcessing] = useState(false);
            const [processedCount, setProcessedCount] = useState(0);
            const [showPromptGuide, setShowPromptGuide] = useState(true); 
            const [copySuccess, setCopySuccess] = useState(false);
            const [activeTheme, setActiveTheme] = useState('daily');
            const [activeStyle, setActiveStyle] = useState('qversion');
            const [promptMode, setPromptMode] = useState('char_text');
            const [charMode, setCharMode] = useState('upload'); 
            const [customChar, setCustomChar] = useState('');
            const [targetColorHex, setTargetColorHex] = useState("#00ff00");
            const [colorTolerance, setColorTolerance] = useState(30); 
            const [smoothness, setSmoothness] = useState(2); 
            const [despill, setDespill] = useState(true); 
            const [gridPos, setGridPos] = useState({ x: 0, y: 0, scale: 1.0 });
            
            const workerRef = useRef(null);

            useEffect(() => {
                workerRef.current = new Worker(workerUrl);
                workerRef.current.onmessage = (e) => {
                    const { id, dataUrl } = e.data;
                    setFinalImages(prev => {
                        const exists = prev.find(img => img.id === id);
                        if (exists) return prev;
                        return [...prev, { id, dataUrl }].sort((a,b) => a.id - b.id);
                    });
                    setProcessedCount(prev => prev + 1);
                };
                return () => { if (workerRef.current) workerRef.current.terminate(); }

                                        <p>打開 <a href="https://creator.line.me/zh-hant/" target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:text-blue-300 underline font-bold">Line Creators Market</a>，整包壓縮檔直接上傳～</p>
                                        <p className="text-xs text-slate-500 mt-2 border-t border-slate-700 pt-2 leading-relaxed">
                                            提醒：完成分割去背後的貼圖，也可以放在其他社群工具內使用，例如：IG、Messenger、WhatsAPP、Telegram、Discord.....等等。
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-800 rounded-3xl shadow-lg border border-slate-700 p-6 mb-8">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-lg text-white flex items-center gap-2"><IconWand2 className="w-5 h-5 text-line"/> AI 提示詞大師</h3>
                                <button onClick={() => setShowPromptGuide(!showPromptGuide)} className="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                                    {showPromptGuide ? "隱藏" : "展開"} <IconChevronDown className={`w-3 h-3 transition-transform ${showPromptGuide ? 'rotate-180' : ''}`} />
                                </button>
                            </div>
                            <div className={`transition-all duration-300 ${showPromptGuide ? 'opacity-100' : 'opacity-50 grayscale'}`}>
                                <div className="p-4 bg-slate-900 border border-slate-700 rounded-xl mb-4 space-y-6">
                                    
                                    <div className="space-y-4">
                                        <span className="ui-header-label">1. 內容模式選擇：</span>
                                        <div className="flex gap-2 flex-wrap">
                                            {PROMPT_MODES.map((mode) => (
                                                <button key={mode.id} onClick={() => setPromptMode(mode.id)} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all border flex items-center gap-2 ${promptMode === mode.id ? 'bg-orange-600 text-white border-orange-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-500'}`}>
                                                    {mode.icon} {mode.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <span className="ui-header-label">2. 設定角色來源：</span>
                                        <div className="flex flex-col gap-4">
                                            <div className="flex gap-2">
                                                <button onClick={()=>setCharMode('upload')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all border ${charMode === 'upload' ? 'bg-green-600 border-green-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500'}`}>參考上傳圖</button>
                                                <button onClick={()=>setCharMode('custom')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all border ${charMode === 'custom' ? 'bg-blue-600 border-blue-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500'}`}>自訂角色</button>
                                            </div>
                                            {charMode === 'custom' && (
                                                <div className="w-full max-w-2xl animate-fade-in">
                                                    <input type="text" placeholder="範例：一隻穿著太空衣正在喝珍奶的機器人、或戴著皇冠的貓咪" value={customChar} onChange={(e)=>setCustomChar(e.target.value)} className="w-full bg-slate-800 border border-slate-600 p-3 rounded-lg text-white text-sm focus:outline-none focus:border-line shadow-inner" />
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <span className="ui-header-label">3. 選擇主題內容：</span>
                                        <div className="flex gap-2 flex-wrap">
                                            {Object.entries(PROMPT_THEMES).map(([key, theme]) => (
                                                <button key={key} onClick={() => setActiveTheme(key)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeTheme === key ? 'bg-blue-600 text-white border-blue-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-500'}`}>{theme.label}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <span className="ui-header-label">4. 選擇畫風：</span>
                                        <div className="flex gap-2 flex-wrap">
                                            {Object.entries(PROMPT_STYLES).map(([key, style]) => (
                                                <button key={key} onClick={() => setActiveStyle(key)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${activeStyle === key ? 'bg-purple-600 text-white border-purple-500 shadow-md' : 'bg-slate-800 text-slate-400 border-slate-700 hover:border-slate-500'}`}>{style.label}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <PromptDisplay />
                                <div className="mt-4 flex justify-end gap-3">
                                    <a href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer" className="px-6 py-3 rounded-xl font-bold flex items-center gap-2 bg-blue-600 text-white hover:bg-blue-700 transition-all shadow-md">
                                        前往Gemini
                                    </a>
                                    <button onClick={handleCopyPrompt} className={`px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-all ${copySuccess ? 'bg-green-600 text-white' : 'bg-white text-slate-900 hover:bg-slate-200'}`}>
                                        {copySuccess ? <IconCheckCircle className="w-5 h-5"/> : <IconCopy className="w-5 h-5"/>}
                                        {copySuccess ? "已複製成功！" : "複製 5x4 貼圖 Prompt"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={`step-card bg-slate-800 rounded-3xl shadow-lg border border-slate-700 p-8 mb-8 ${step !== 2 && 'hidden'}`}>
                        <div className="grid grid-cols-4 md:grid-cols-5 lg:grid-cols-10 gap-2 mb-8">
                            {slicedPieces.map((p) => (
                                <div key={p.id} className="aspect-square bg-slate-900 rounded-lg border border-slate-700 p-1 flex items-center justify-center overflow-hidden">
                                    <img src={p.previewUrl} className="w-full h-full object-contain" />
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-center gap-4 pt-8 border-t border-slate-700 mt-6 text-center">
                            <p className="text-slate-400 text-sm mb-4 block w-full">💡 去背時將自動執行 3px 侵蝕處理，確保無黑邊殘留。</p>
                            <div className="flex gap-4 w-full justify-center">
                                <button onClick={()=>setStep(1)} className="px-6 py-3 rounded-xl font-bold text-slate-400 bg-slate-900 hover:bg-slate-700 hover:text-white transition">重新上傳</button>
                                <button onClick={performProcessing} disabled={isProcessing} className="bg-line hover:bg-green-600 text-white px-12 py-3 rounded-xl font-bold shadow-lg shadow-green-900/20 transition-all btn-press flex items-center justify-center gap-2 min-w-[240px]">
                                    {isProcessing ? <><IconLoader /><span>處理中 ({processedCount}/20)</span></> : <><IconEraser />執行去背處理</>}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className={`step-card bg-slate-800 rounded-3xl shadow-lg border border-slate-700 p-8 mb-8 ${step !== 3 && 'hidden'}`}>
                         <div className="mb-8 border-b border-slate-700 pb-6">
                            <h2 className="text-2xl font-bold text-white flex items-center gap-2 mb-2"><IconCheckCircle className="text-line"/> 設定與打包下載</h2>
                        </div>
                        
                        <div className="flex flex-col xl:flex-row gap-6 items-end mb-8">
                            <div className="w-full xl:flex-1 bg-yellow-500/10 border border-yellow-500/30 p-5 rounded-xl text-yellow-200">
                                <div className="font-bold flex items-center gap-2 mb-2 text-yellow-400 font-bold text-lg"><IconInfo className="w-5 h-5"/> 下載前注意事項：</div>
                                <ul className="list-disc pl-6 space-y-1 opacity-90 text-sm">
                                    <li>選擇 <span className="font-bold text-white underline">main / tab 封面圖</span>：點擊貼圖下方的按鈕設定主圖與表情貼標籤。</li>
                                    <li>設定 <span className="font-bold text-white font-mono underline">起始編號</span>：如生第二組，可改為 21。</li>
                                </ul>
                            </div>
                            
                            <div className="w-full xl:w-auto flex flex-row items-stretch gap-3">
                                <div className="bg-slate-900 px-4 py-2 rounded-xl border border-slate-600 flex flex-col justify-center min-w-[140px]">
                                    <span className="text-xs font-bold text-slate-400 flex items-center gap-1 mb-1"><IconHash className="w-3 h-3"/> 起始編號</span>
                                    <input type="number" min="1" value={startNumber} onChange={(e) => setStartNumber(Math.max(1, parseInt(e.target.value) || 1))} className="w-full bg-slate-800 border border-slate-600 text-white rounded-lg text-center font-bold text-lg outline-none py-1" />
                                </div>
                                <button onClick={downloadZip} className="flex-1 bg-line hover:bg-green-600 text-white px-8 py-4 rounded-xl font-bold shadow-lg transition-all btn-press flex items-center justify-center gap-2 text-lg"><IconDownload className="w-6 h-6" /> 下載完整 ZIP</button>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                            {finalImages.map((img, idx) => (
                                <div key={img.id} className="bg-slate-900 rounded-2xl border border-slate-700 p-4 hover:border-green-500 transition-all shadow-md group">
                                    <div className="aspect-square grid-bg rounded-xl flex items-center justify-center overflow-hidden border border-slate-700 mb-3"><img src={img.dataUrl} className="w-full h-full object-contain scale-95 group-hover:scale-100 transition-transform" /></div>
                                    <div className="text-center text-xs font-bold text-slate-500 mb-3 bg-slate-800 rounded py-1 font-mono">{ getFileName(idx) }.png</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setMainId(img.id)} className={`py-2 rounded-lg transition-all flex items-center justify-center gap-1 text-xs ${mainId === img.id ? 'bg-orange-600 text-white font-bold shadow-lg' : 'bg-slate-800 text-slate-500 hover:bg-slate-700 border border-slate-700'}`} title="設定為主圖 (240x240)"><IconStar className="w-3 h-3" /> Main</button>
                                        <button onClick={() => setTabId(img.id)} className={`py-2 rounded-lg transition-all flex items-center justify-center gap-1 text-xs ${tabId === img.id ? 'bg-line text-white font-bold shadow-lg' : 'bg-slate-800 text-slate-500 hover:bg-slate-700 border border-slate-700'}`} title="設定為標籤圖 (96x74)"><IconTag className="w-3 h-3" /> Tab</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="text-center mt-10"><button onClick={()=>setStep(1)} className="text-slate-500 hover:text-slate-300 text-sm font-medium transition-colors underline">處理下一個原始檔</button></div>
                    </div>
                    
                    <footer className="mt-20 border-t border-slate-800 pt-12 text-center text-slate-500 space-y-8">
                        <div className="flex flex-col md:flex-row justify-center items-center gap-4">
                            <a href="https://www.youtube.com/@meiko1" target="_blank" className="bg-youtube text-white px-8 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition-all flex items-center gap-3">
                                <IconYoutube className="w-6 h-6" /> Meiko微課頻道
                            </a>
                            <a href="https://discord.gg/BMRHfGas" target="_blank" className="bg-discord text-white px-8 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition-all flex items-center gap-3">
                                <IconDiscord className="w-6 h-6" /> Meiko Discord 頻道
                            </a>
                        </div>
                        <div className="space-y-2">
                            <div className="text-lg font-bold text-white">© 2025 Meiko 微課頻道 | LINE Sticker Factory 3.0</div>
                            <div className="text-sm max-w-2xl mx-auto opacity-80 leading-relaxed">
                                歡迎前往 <span className="text-line font-bold">【Meiko微課頻道】</span> 學習更多 AI 應用、Excel 技術、Power Query 實戰技巧。
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
